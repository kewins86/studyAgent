# ============================================================
# K9-Edu 前端静态托管配置
# 部署：把本文件复制到服务器 /etc/nginx/conf.d/k9.conf
#       然后执行：nginx -t && nginx -s reload
# 说明：仅做静态托管，不连后端（后端联调后续再加）。
# ============================================================

server {
    # 没有域名时直接用服务器 IP 访问；想用 IP 直访请把本行改成：
    #   listen 80 default_server;
    # 已有其他 default_server 冲突时，改成你的域名（见下）即可。
    listen 80;
    # 有域名时改成：server_name k9.yourdomain.com;
    server_name _;

    root /data/k9;
    index index.html;

    # SPA 回退：未匹配的路径交给 index.html（hash 路由也可正常打开）
    location / {
        try_files $uri $uri/ /index.html;
    }

    # ---- 后端 API 反代（后端部署到同机 8080 后再启用）----
    # location /api/ {
    #     proxy_pass http://127.0.0.1:8080/;
    #     proxy_set_header Host $host;
    #     proxy_set_header X-Real-IP $remote_addr;
    #     proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    # }

    # ---- 需要 HTTPS 时 ----
    # 参考服务器上已有的 qiangeai.conf：新增 listen 443 ssl 段，
    # 配置 ssl_certificate / ssl_certificate_key（证书放 /data/ssl/k9/），
    # 并把上面 80 段改成 return 301 https://$host$request_uri;
}
